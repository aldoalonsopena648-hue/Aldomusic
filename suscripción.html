  <meta charset="UTF-8">

  <title>Formulario Validado - 3er Parcial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<center> <form id="miFormulario" novalidate>
    <h2>SUSCRIPCIÓN</h2>


<form>
<label>Nombre:</label>
<input type="text" id="nombre" maxlength="100" oninput="this.value=this.value.toUpperCase()" placeholder="">
<span class="error" id="errorNombre"></span>

<label>Apellido Paterno:</label>
<input type="text" id="paterno" maxlength="100" oninput="this.value=this.value.toUpperCase()" placeholder="">
<span class="error" id="errorPaterno"></span>

<label>Apellido Materno:</label>
<input type="text" id="materno" maxlength="100" oninput="this.value=this.value.toUpperCase()" placeholder="">
<span class="error" id="errorMaterno"></span>

<label>Edad:</label>
<input type="text" id="edad" maxlength="3" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="">
<span class="error" id="errorEdad"></span>

<label>Teléfono:</label>
<input type="text" id="telefono" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="">
<span class="error" id="errorTelefono"></span>

<label>Email:</label>
<input type="text" id="email" placeholder="">
<span class="error" id="errorEmail"></span>

<label>Fecha de nacimiento:</label>
<div class=" compa">
    <label for="fecha de nacimiento"></label>
      <input type="date" id=" fecha">
      <small class=" mensaje" id="errorCuenta"></small>
  </div>
<label>Número de Tarjeta:</label>
<input type="text" id="tarjeta" maxlength="19" placeholder="" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ')">
<span class="error" id="errorTarjeta"></span>

<button type="submit">SUSCRICIÓN</button>
</form>
  <div id="resultado"></div>

  <script src="script.js"></script>
  </form>
  </center>
 

</body>
